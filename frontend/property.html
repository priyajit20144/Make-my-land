<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Property Details | Make My Land</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
      <div class="container">
        <a class="navbar-brand" href="index.html"><img src="images/logo.png" alt="Make My Land" class="navbar-logo" /></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto align-items-center"></ul>
        </div>
      </div>
    </nav>

    <section class="container py-5 page-top">
      <div id="property-details-content" class="row g-4">
        <div class="col-12 text-center text-muted">Loading property details…</div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        const container = document.getElementById('property-details-content');
        const params = new URLSearchParams(window.location.search);
        const propertyId = params.get('id');

        if (!propertyId) {
          container.innerHTML = '<div class="col-12 text-center text-muted">No property selected.</div>';
          return;
        }

        try {
          const response = await fetch(`/api/properties/${propertyId}`);
          const property = await response.json();

          if (!property || property.message) {
            container.innerHTML = '<div class="col-12 text-center text-muted">Property not found.</div>';
            return;
          }

          const image = Array.isArray(property.images) && property.images.length
            ? property.images[0]
            : 'https://images.unsplash.com/photo-1460317442991-0ec209397118?auto=format&fit=crop&w=900&q=80';
          const area = property.area ? `${property.area} ${property.areaScale || 'sq-ft'}` : 'Area not specified';
          const lat = Number(property.latitude || 0);
          const lng = Number(property.longitude || 0);

          container.innerHTML = `
            <div class="col-lg-7">
              <div class="card glass-card p-3">
                <img src="${image}" alt="${property.title}" class="img-fluid rounded-4 w-100" style="max-height: 420px; object-fit: cover;" />
                <div class="card-body">
                  <div class="d-flex justify-content-between align-items-start gap-3 mb-3">
                    <div>
                      <h2 class="fw-bold">${property.title}</h2>
                      <p class="text-muted mb-0">${property.village || 'Location'} · ${property.district || 'District'} · ${property.state || 'State'}</p>
                    </div>
                    <span class="badge bg-success">${property.verified ? 'Verified' : 'Pending'}</span>
                  </div>
                  <p class="lead">${property.description || 'No description provided.'}</p>
                  <div class="row g-3 mt-2">
                    <div class="col-md-6"><strong>Price:</strong> ₹${Number(property.price || 0).toLocaleString()}</div>
                    <div class="col-md-6"><strong>Area:</strong> ${area}</div>
                    <div class="col-md-6"><strong>Type:</strong> ${property.landType || 'Residential'}</div>
                    <div class="col-md-6"><strong>Status:</strong> ${property.status || 'available'}</div>
                    <div class="col-md-6"><strong>Owner:</strong> ${property.ownerName || '—'}</div>
                    <div class="col-md-6"><strong>Contact:</strong> ${property.ownerPhone || property.ownerEmail || '—'}</div>
                    <div class="col-12"><strong>Address:</strong> ${property.address || 'Address not provided.'}</div>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-lg-5">
              <div class="card glass-card p-3 mb-4">
                <h4 class="mb-3">Buy This Land</h4>
                <form id="property-buy-form" class="row g-3">
                  <input type="hidden" name="propertyId" value="${property._id}" />
                  <input type="hidden" name="landType" value="${property.landType || 'Residential'}" />
                  <input type="hidden" name="preferredLocation" value="${property.village || property.district || property.state || ''}" />
                  <div class="col-12">
                    <input class="form-control" name="name" placeholder="Your full name" required />
                  </div>
                  <div class="col-12">
                    <input class="form-control" name="phone" placeholder="Phone number" required />
                  </div>
                  <div class="col-12">
                    <input class="form-control" name="email" type="email" placeholder="Email address" required />
                  </div>
                  <div class="col-12">
                    <input class="form-control" name="budget" type="number" placeholder="Budget (₹)" required />
                  </div>
                  <div class="col-12">
                    <input class="form-control" name="requiredArea" type="number" placeholder="Required area" required />
                  </div>
                  <div class="col-12">
                    <textarea class="form-control" name="notes" rows="3" placeholder="Tell us about your interest"></textarea>
                  </div>
                  <div class="col-12">
                    <button type="submit" class="btn btn-gold w-100">Submit Buy Request</button>
                  </div>
                </form>
                <div id="buy-request-message" class="mt-3 small"></div>
              </div>
              <div class="card glass-card p-3">
                <h4 class="mb-3">Live Location</h4>
                <div class="rounded-4 overflow-hidden border" style="height: 320px; background: linear-gradient(135deg, #1f3a2f, #10241d);">
                  <iframe
                    title="Property map"
                    width="100%"
                    height="100%"
                    loading="lazy"
                    allowfullscreen
                    referrerpolicy="no-referrer-when-downgrade"
                    src="https://www.google.com/maps?q=${lat},${lng}&z=15&output=embed"
                  ></iframe>
                </div>
                <p class="small text-muted mt-3 mb-0">Coordinates: ${lat}, ${lng}</p>
              </div>
            </div>
          `;

          const buyForm = document.getElementById('property-buy-form');
          const messageBox = document.getElementById('buy-request-message');
          if (buyForm && messageBox) {
            buyForm.addEventListener('submit', async (event) => {
              event.preventDefault();
              const payload = Object.fromEntries(new FormData(buyForm));
              payload.budget = Number(payload.budget);
              payload.requiredArea = Number(payload.requiredArea);
              payload.propertyId = property._id;

              try {
                const response = await fetch('/api/requests', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(payload)
                });
                const result = await response.json();
                if (response.ok) {
                  messageBox.innerHTML = '<div class="alert alert-success mb-0">Your buy request was sent successfully.</div>';
                  buyForm.reset();
                } else {
                  messageBox.innerHTML = `<div class="alert alert-danger mb-0">${result.message || 'Unable to submit request.'}</div>`;
                }
              } catch (error) {
                messageBox.innerHTML = '<div class="alert alert-danger mb-0">Request failed. Please try again.</div>';
              }
            });
          }
        } catch (error) {
          container.innerHTML = '<div class="col-12 text-center text-muted">Unable to load property details.</div>';
        }
      });
    </script>
  </body>
</html>
