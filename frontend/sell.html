<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sell Land | Make My Land</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
      <div class="container">
        <a class="navbar-brand" href="index.html"><img src="images/logo.png" alt="Make My Land" class="navbar-logo" /></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto align-items-center"></ul>
        </div>
      </div>
    </nav>

    <section class="container py-5 page-top">
      <div class="row mb-5">
        <div class="col-lg-8 mx-auto text-center">
          <h1 class="display-4 fw-bold mb-3">List Your Property</h1>
          <p class="lead text-muted">Reach thousands of verified buyers and sellers. List your land with complete documentation and get multiple offers within days.</p>
        </div>
      </div>
      
      <div class="row">
        <div class="col-lg-10 mx-auto">
          <div class="card glass-card p-5">
            <form id="sell-form" class="row g-4">
              <div class="col-12">
                <h5 class="mb-4">Owner Information</h5>
              </div>
              <div class="col-md-6"><input class="form-control form-control-enhanced" name="ownerName" placeholder="Full Name" required /></div>
              <div class="col-md-6"><input class="form-control form-control-enhanced" name="ownerPhone" placeholder="Phone Number" required /></div>
              <div class="col-md-6"><input class="form-control form-control-enhanced" name="ownerEmail" type="email" placeholder="Email Address" required /></div>
              <div class="col-md-6"><input class="form-control form-control-enhanced" name="address" placeholder="Full Address" required /></div>

              <div class="col-12 mt-4">
                <h5 class="mb-4">Property Details</h5>
              </div>
              <div class="col-12"><input class="form-control form-control-enhanced" name="title" placeholder="Property Title (e.g., Agricultural Land in Gurugram)" required /></div>
              <div class="col-12"><textarea class="form-control form-control-enhanced" name="description" rows="4" placeholder="Describe your property - amenities, condition, features, etc." required></textarea></div>
              <div class="col-md-4"><input class="form-control form-control-enhanced" name="price" type="number" placeholder="Price (₹)" required /></div>
              <div class="col-md-4"><input class="form-control form-control-enhanced" name="area" type="number" placeholder="Area" required /></div>
              <div class="col-md-4">
                <select class="form-select form-select-enhanced" name="areaScale" required>
                  <option value="">Select Unit</option>
                  <option value="sq-ft">Square Feet (sq ft)</option>
                  <option value="sq-m">Square Meters (sq m)</option>
                  <option value="acres">Acres</option>
                  <option value="hectares">Hectares (ha)</option>
                  <option value="bigha">Bigha</option>
                  <option value="kattha">Kattha</option>
                </select>
              </div>
              <div class="col-md-4">
                <select class="form-select form-select-enhanced" name="landType" required>
                  <option value="">Select Land Type</option>
                  <option value="agricultural">Agricultural</option>
                  <option value="residential">Residential</option>
                  <option value="commercial">Commercial</option>
                  <option value="industrial">Industrial</option>
                  <option value="mixed">Mixed Use</option>
                </select>
              </div>
              <div class="col-md-4"><input class="form-control form-control-enhanced" name="village" placeholder="Village" required /></div>
              <div class="col-md-4"><input class="form-control form-control-enhanced" name="district" placeholder="District" required /></div>
              <div class="col-md-4"><input class="form-control form-control-enhanced" name="state" placeholder="State" required /></div>
              <div class="col-md-6"><input class="form-control form-control-enhanced" name="latitude" type="number" placeholder="Latitude" /></div>
              <div class="col-md-6"><input class="form-control form-control-enhanced" name="longitude" type="number" placeholder="Longitude" /></div>

              <div class="col-12 mt-4">
                <h5 class="mb-4">Media & Documents</h5>
              </div>
              <div class="col-12"><input class="form-control form-control-enhanced" type="file" multiple accept="image/*,.pdf" /></div>

              <div class="col-12 mt-4">
                <button type="submit" class="btn btn-primary-cta btn-lg w-100">Preview & Submit Listing</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Handle sell form submission
      document.getElementById('sell-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData);
        
        try {
          const response = await fetch('http://localhost:5000/api/properties', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              ...data,
              price: parseFloat(data.price),
              area: parseFloat(data.area),
              latitude: data.latitude ? parseFloat(data.latitude) : 0,
              longitude: data.longitude ? parseFloat(data.longitude) : 0,
              featured: true,
              status: 'available'
            })
          });
          
          if (response.ok) {
            alert('✅ Property listed successfully! It will appear on the home page.');
            e.target.reset();
            setTimeout(() => window.location.href = 'index.html', 1000);
          } else {
            alert('❌ Error listing property. Please try again.');
          }
        } catch (error) {
          console.error('Error:', error);
          alert('❌ Network error. Make sure backend is running on http://localhost:5000');
        }
      });
    </script>
    <script src="js/app.js"></script>
  </body>
</html>
