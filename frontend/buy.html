<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buy Land | Make My Land</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
      <div class="container">
        <a class="navbar-brand" href="index.html"><img src="images/logo.png" alt="Make My Land" class="navbar-logo" /></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto align-items-center"></ul>
        </div>
      </div>
    </nav>

    <section class="container py-5 page-top">
      <div class="row mb-5">
        <div class="col-lg-8 mx-auto text-center">
          <h1 class="display-4 fw-bold mb-3">Find Your Perfect Land</h1>
          <p class="lead text-muted">Submit your buying request and our expert team will help you find the best verified properties matching your needs and budget.</p>
        </div>
      </div>
      
      <div class="row">
        <div class="col-lg-10 mx-auto">
          <div class="card glass-card p-5">
            <form id="buy-form" class="row g-4">
              <div class="col-12">
                <h5 class="mb-4">Your Information</h5>
              </div>
              <div class="col-md-6"><input class="form-control form-control-enhanced" name="name" placeholder="Your Full Name" required /></div>
              <div class="col-md-6"><input class="form-control form-control-enhanced" name="phone" placeholder="Phone Number" required /></div>
              <div class="col-md-6"><input class="form-control form-control-enhanced" name="email" type="email" placeholder="Email Address" required /></div>
              <div class="col-md-6"><input class="form-control form-control-enhanced" name="budget" type="number" placeholder="Budget (₹)" required /></div>

              <div class="col-12 mt-4">
                <h5 class="mb-4">Requirements</h5>
              </div>
              <div class="col-md-6"><input class="form-control form-control-enhanced" name="requiredArea" type="number" placeholder="Required Area" required /></div>
              <div class="col-md-6">
                <select class="form-select form-select-enhanced" name="areaScale" required>
                  <option value="">Select Unit</option>
                  <option value="sq-ft">Square Feet (sq ft)</option>
                  <option value="sq-m">Square Meters (sq m)</option>
                  <option value="acres">Acres</option>
                  <option value="hectares">Hectares (ha)</option>
                  <option value="bigha">Bigha</option>
                  <option value="kattha">Kattha</option>
                </select>
              </div>
              <div class="col-md-6"><input class="form-control form-control-enhanced" name="preferredLocation" placeholder="Preferred Location (City/State)" required /></div>
              <div class="col-md-6">
                <select class="form-select form-select-enhanced" name="landType" required>
                  <option value="">Select Land Type</option>
                  <option value="agricultural">Agricultural</option>
                  <option value="residential">Residential</option>
                  <option value="commercial">Commercial</option>
                  <option value="industrial">Industrial</option>
                  <option value="mixed">Mixed Use</option>
                </select>
              </div>

              <div class="col-12 mt-4">
                <h5 class="mb-4">Additional Information</h5>
              </div>
              <div class="col-12"><textarea class="form-control form-control-enhanced" name="notes" rows="4" placeholder="Tell us more about what you're looking for - amenities, location preferences, timeline, etc."></textarea></div>

              <div class="col-12 mt-4">
                <button type="submit" class="btn btn-primary-cta btn-lg w-100">Submit Your Request</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
